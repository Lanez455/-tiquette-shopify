# Configuration Fly.io. Remplacez « etiquettes-codes-barres » par le nom choisi
# avec `fly launch` (voir docs/DEPLOIEMENT.md).
app = "etiquettes-codes-barres"
primary_region = "cdg"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # La base SQLite vit sur le volume monté en /data : elle survit aux redémarrages
  DATABASE_URL = "file:/data/prod.sqlite"
  SCOPES = "read_products,write_products,read_inventory,write_inventory,read_locations,read_inventory_purchase_orders,read_inventory_transfers"

[[mounts]]
  source = "donnees"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # SQLite : une seule machine, toujours allumée (les webhooks doivent être reçus)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
