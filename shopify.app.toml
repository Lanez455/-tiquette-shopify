# Configuration de l'app. client_id et application_url sont remplis par
# `shopify app config link` une fois le compte Partenaire créé.
client_id = "45f064b1938d90f6b9716f5b31beeec1"
name = "Etiqo Barcode Labels"
application_url = "https://etiqo-barcode-labels.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Webhooks RGPD obligatoires pour une app publique
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# Voir docs/SPEC.md, section « Accès demandés à la boutique »
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations,read_inventory_purchase_orders,read_inventory_transfers"

[auth]
redirect_urls = [ "https://etiqo-barcode-labels.fly.dev/auth/callback" ]
